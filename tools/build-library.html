const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ');

function findMonologue(plays, [title, who, phrase, gender, tone]) {
  const play = plays.find(p => p.title === title);
  const line = play?.text.split('\n').find(l => l.startsWith(who + ': ') && norm(l).includes(norm(phrase)));
  if (!line) return { title, who, phrase, missing: true };
  const text = line.slice(who.length + 2);
  const words = text.replace(/\([^)]*\)/g, ' ').split(/\s+/).filter(Boolean).length;
  return { play: title, author: play.author, character: who, gender, tone, words, firstWords: text.replace(/\([^)]*\)\s*/g, '').split(/\s+/).slice(0, 8).join(' '), text };
}

(async () => {
  const out = [];
  for (const [id, title, author, genre] of PLAYS) {
    const raw = await (await fetch(`raw/pg${id}.txt`)).text();
    const text = gutenbergToScript(raw);
    const speeches = text.split('\n').filter(l => /^[^#(].*?: /.test(l));
    const cast = new Map();
    for (const l of speeches) { const n = l.slice(0, l.indexOf(': ')); cast.set(n, (cast.get(n) || 0) + 1); }
    out.push({ id, title, author, genre, text, speeches: speeches.length, cast: [...cast].sort((a, b) => b[1] - a[1]) });
  }
  document.getElementById('out').textContent = JSON.stringify({ plays: out, monologues: MONOLOGUES.map(m => findMonologue(out, m)) });
})().catch(e => { document.getElementById('out').textContent = 'ERR ' + e.stack; });
