<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Learner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <script>
    // Apply the saved Light/Dark choice before the page draws, so it never flashes the wrong colors.
    try { var t = localStorage.getItem('lineLearner.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=202610171803">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="home">🎭 Line Learner</button>
    <span id="crumb" class="crumb"></span>
    <button id="theme-btn" class="icon-btn theme-btn" data-action="theme"></button>
    <button id="sync-btn" class="sync-btn" data-action="sync-view">Sync</button>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=202610171803"></script>
  <script src="songs.js?v=202610171803"></script>
</body>
</html>
